<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>밤사이 · 장 열리기 전에 먼저 보는 시세</title>
    <meta name="description" content="한국 주식시장이 닫힌 밤과 주말에도 거래되는 하이퍼리퀴드 perp 시세로, 다음 개장 시가와 두 시장 차익을 알려드려요." />

    <link rel="preconnect" href="https://api.hyperliquid.xyz" />

    <script>
      // 첫 페인트 전에 테마 적용 (깜빡임 방지)
      try {
        var t = JSON.parse(localStorage.getItem('bamsai-prefs') || '{}').state?.theme
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
