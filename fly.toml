# API server. Issuing a new Toss Securities token invalidates the previous one, so always run exactly 1 machine
app = "bamsai-api"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# GET /api/health: 503 when Hyperliquid or Upbit has not answered for 5 min (see docs/ops/runbook.md).
# The endpoint answers within ~3 s; the grace period covers boot. Checks only, nothing here adds machines
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
